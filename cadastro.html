<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STUDIOE BARBEARIA - Criar Conta</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,500;0,700;0,900;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/agendamentos.css">

    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
        }
      }
    </script>

    <style>
        /* Base de referência: 1rem = 16px */
        html {
            font-size: 16px;
        }

        /* Tela cheia com fundo gradiente escuro */
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
            background: linear-gradient(
                to bottom,
                #3c3c3c 0%,
                #1b1b1b 45%,
                #121212 100%
            );
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            max-width: 30rem;
            width: 100%;
            margin: 0 auto;
            padding: 1rem;
            padding-top: max(1rem, env(safe-area-inset-top));
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
            box-sizing: border-box;
            overflow: hidden;
        }

        header {
            padding: 0.25rem 0;
            flex-shrink: 0;
            text-align: center;
        }

        .brand-title {
            font-size: 1.1rem;
            margin-bottom: 0.125rem;
            font-weight: 700;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: #b0b0b0;
            margin: 0;
        }

        /* Container de Cadastro transparente alinhado com o login */
        .login-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
            min-height: 0;
            width: 100%;
            max-width: 20rem;
            margin: 0 auto;
            padding: 0;
            background: transparent;
            box-shadow: none;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 0.625rem;
            width: 100%;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        /* Rótulos padronizados com o login */
        .input-label {
            font-size: 0.8rem;
            color: #e0e0e0;
            margin-bottom: 0.25rem;
            font-weight: 600;
        }

        .input-field {
            width: 100%;
            padding: 0.625rem 0.75rem;
            background-color: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 0.5rem;
            color: #ffffff;
            font-size: 0.85rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field:focus {
            border-color: #666666;
        }

        /* Botão Criar Conta */
        .btn-auth-primary {
            background-color: #ffffff;
            color: #121212;
            font-weight: 700;
            padding: 0.7rem;
            border-radius: 0.5rem;
            border: none;
            font-size: 0.875rem;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: block;
            margin-top: 0.375rem;
            transition: background 0.3s;
            width: 100%;
        }

        .btn-auth-primary:hover {
            background-color: #e0e0e0;
        }

        /* Botão Voltar para o Login */
        .btn-auth-secondary {
            background-color: transparent;
            color: #b0b0b0;
            font-weight: 500;
            padding: 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid #333333;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: block;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        .btn-auth-secondary:hover {
            background-color: #1f1f1f;
            color: #ffffff;
            border-color: #555555;
        }

        footer {
            padding: 0.25rem 0;
            flex-shrink: 0;
            text-align: center;
        }

        .address-box {
            font-size: 0.75rem;
            color: #888888;
        }

        .toast {
            position: fixed;
            top: 1.25rem;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ff4d4d;
            color: white;
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            z-index: 1000;
            display: none;
            box-shadow: 0 0.25rem 0.75rem rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="toast" class="toast">Erro ao criar conta.</div>

    <div class="app-wrapper">
        
        <header>
            <div class="logo-container">
                <img src="img/image.png" alt="StudioE Barbearia" onerror="this.onerror=null; this.src='image.png';">
            </div>

            <div>
                <h1 class="brand-title">STUDIOE BARBEARIA</h1>
                <p class="brand-subtitle">Crie sua conta</p>
            </div>
        </header>

        <main class="login-container">
            <form id="cadastro-form" class="login-form">
                
                <div class="input-group">
                    <label class="input-label">• Nome Completo</label>
                    <input type="text" id="cad-nome" class="input-field" placeholder="Seu nome" required autocomplete="name">
                </div>

                <div class="input-group">
                    <label class="input-label">• WhatsApp</label>
                    <input type="tel" id="cad-telefone" class="input-field" placeholder="(00) 00000-0000" required autocomplete="tel">
                </div>

                <div class="input-group">
                    <label class="input-label">• E-mail de acesso</label>
                    <input type="email" id="cad-email" class="input-field" placeholder="seu@email.com" required autocomplete="email">
                </div>

                <div class="input-group">
                    <label class="input-label">• Senha</label>
                    <input type="password" id="cad-senha" class="input-field" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
                </div>

                <button type="submit" class="btn-auth-primary" id="btn-cadastrar">
                    Criar Minha Conta
                </button>
                
                <a href="login.html" class="btn-auth-secondary">
                    Já tem conta? Faça Login
                </a>

            </form>
        </main>

        <footer>
            <div class="address-box">
                <i class="fa-solid fa-location-dot"></i>
                <span>R. Willy Schroeder, 370 - Centro | Lontras - SC</span>
            </div>
        </footer>

    </div>

    <script type="module" src="js/cadastro.js" defer></script>
</body>
</html>
